  table{width:100%;border-collapse:collapse;font-size:13.5px}

  tbody td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}

    display:flex;align-items:flex-end;justify-content:center;z-index:50;

    background:#fff;border-radius:18px 18px 0 0;max-width:560px;width:100%;

/* ---------------- Router ---------------- */

/* ---------------- Helpers ---------------- */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genRequestId(){
  const n = Math.floor(1000 + Math.random()*9000);
  return `GEOM-${YEAR}-${n}`;
}
async function createUniqueRequestId(){
  for(let i=0;i<8;i++){
    const id = genRequestId();
    const snap = await getDoc(doc(db,'requests',id));
    if(!snap.exists()) return id;
  }
  return `GEOM-${YEAR}-${Date.now().toString().slice(-6)}`;
}
/**
 * ضغط الصورة قبل الرفع: بيقلل الأبعاد لحد أقصى ويحوّلها JPEG بجودة مضبوطة،
 * فبتترفع بسرعة حتى لو الطالب رفع صورة أصلية كبيرة من الموبايل.
 */
function compressImage(file, maxDim = 1600, quality = 0.72){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if(!blob){ reject(new Error('تعذر ضغط الصورة')); return; }
        // لو الضغط لأي سبب زوّد الحجم (نادر جدًا)، ارفع الأصلية
        if(blob.size >= file.size && file.size < 3*1024*1024){ resolve(file); return; }
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذر قراءة الصورة')); };
    img.src = url;
  });
}

function fmtDate(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' });
}
function statusBadge(status){
  if(status==='approved') return `<span class="status-badge status-approved">🟢 تم القبول</span>`;
  if(status==='rejected') return `<span class="status-badge status-rejected">🔴 مرفوض</span>`;
  return `<span class="status-badge status-pending">🟡 قيد المراجعة</span>`;
}

function topoSvg(light){
  const stroke = light ? 'white' : '%236E1E2A';
  return `<svg class="topo" viewBox="0 0 400 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,150 Q100,100 200,150 T400,140" fill="none" stroke="white" stroke-width="1"/>
    <path d="M0,170 Q100,120 200,170 T400,160" fill="none" stroke="white" stroke-width="1"/>
    <path d="M0,190 Q100,140 200,190 T400,180" fill="none" stroke="white" stroke-width="1"/>
    <path d="M0,40 Q100,10 200,40 T400,30" fill="none" stroke="white" stroke-width="1"/>
    <path d="M0,20 Q100,-10 200,20 T400,10" fill="none" stroke="white" stroke-width="1"/>
  </svg>`;
}

    </div>

  document.getElementById('go-apply').onclick = () => go('/apply');
  document.getElementById('go-track').onclick = () => go('/track');

/* ---------------- Apply form ---------------- */
function renderApplyForm(){
  app.innerHTML = `
  <header class="hero" style="padding:22px 0">
    <div class="wrap topbar">
      <button class="link-btn" id="back-home">→ رجوع</button>
      <span style="font-weight:700;font-size:14px">تقديم طلب الانضمام</span>
    </div>
  </header>
  <main><div class="wrap">
    <form class="card" id="apply-form" novalidate>
      <div class="field">
        <label>الاسم رباعي</label>
        <input type="text" id="f-name" placeholder="مثال: أحمد محمد علي حسن" required>
        <div class="err" id="err-name">من فضلك أدخل الاسم رباعيًا</div>
      </div>
      <div class="field">
        <label>رقم الهاتف</label>
        <input type="tel" id="f-phone" placeholder="01xxxxxxxxx" required>
        <div class="err" id="err-phone">من فضلك أدخل رقم هاتف صحيح</div>
      </div>
      <div class="field">
        <label>البرنامج / القسم</label>
        <input type="text" id="f-program" value="${PROGRAM_NAME}" readonly style="background:var(--paper-2);color:#6a5a5d">
      </div>
      <div class="field">
        <label>رقم المجموعة</label>
        <select id="f-group" required>
          <option value="">اختر المجموعة</option>
          ${GROUPS.map(g=>`<option value="${g}">مجموعة ${g}</option>`).join('')}
        </select>
        <div class="err" id="err-group">من فضلك اختر المجموعة</div>
      </div>
      <div class="field">
        <label>كود المصاريف</label>
        <input type="text" id="f-fees" placeholder="مثال: 20261234" required>
        <div class="err" id="err-fees">من فضلك أدخل كود المصاريف</div>
      </div>

      <div class="field">
        <label>إثبات القبول (Screenshot)</label>
        <p class="hint" style="margin-bottom:8px">صورة توضح قبولك في مقابلة القسم، والمجموعة، والبيانات المطلوبة للتحقق. JPG / PNG / WEBP — بحد أقصى 10MB.</p>
        <label class="upload-box" id="upload-box">
          <input type="file" id="f-file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
          <div id="upload-placeholder">📷 اضغط لاختيار الصورة</div>
          <img id="upload-preview" class="upload-preview hidden">
        </label>
        <div class="err" id="err-file">من فضلك ارفع صورة بصيغة وحجم صحيحين</div>
      </div>

      <div class="field">
        <label class="checkline">
          <input type="checkbox" id="f-confirm">
          <span>أقر بأن البيانات التي أدخلتها صحيحة وأن Screenshot المرفوع يخصني.</span>
        </label>
        <div class="err" id="err-confirm">من فضلك أكّد إقرارك قبل الإرسال</div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">إرسال الطلب</button>
    </form>
  </div></main>`;

  document.getElementById('back-home').onclick = () => go('/');

  const fileInput = document.getElementById('f-file');
  const uploadBox = document.getElementById('upload-box');
  const preview = document.getElementById('upload-preview');
  const placeholder = document.getElementById('upload-placeholder');
  let selectedFile = null;

  fileInput.onchange = () => {
    const file = fileInput.files[0];
    if(!file) return;
    const okType = ['image/jpeg','image/png','image/webp'].includes(file.type);
    const okSize = file.size <= 10*1024*1024;
    if(!okType || !okSize){
      document.getElementById('err-file').classList.add('show');
      selectedFile = null;
      return;
    }
    document.getElementById('err-file').classList.remove('show');
    selectedFile = file;
    uploadBox.classList.add('has-file');
    placeholder.classList.add('hidden');
    preview.classList.remove('hidden');
    preview.src = URL.createObjectURL(file);
  };

  document.getElementById('apply-form').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const group = document.getElementById('f-group').value;
    const fees = document.getElementById('f-fees').value.trim();
    const confirmed = document.getElementById('f-confirm').checked;

    let valid = true;
    const setErr = (id, cond) => { document.getElementById(id).classList.toggle('show', cond); if(cond) valid=false; };
    setErr('err-name', name.split(/\s+/).filter(Boolean).length < 4);
    setErr('err-phone', !/^01[0-9]{9}$/.test(phone));
    setErr('err-group', !group);
    setErr('err-fees', fees.length < 3);
    setErr('err-file', !selectedFile);
    setErr('err-confirm', !confirmed);
    if(!valid) return;

    document.getElementById('submit-btn').disabled = true;
    app.innerHTML = `<main><div class="wrap"><div class="loader">
      <div class="spinner"></div>
      <p style="font-weight:700" id="loader-text">جاري تجهيز الصورة...</p>
    </div></div></main>`;

    try{
      const compressed = await compressImage(selectedFile);
      const loaderText = document.getElementById('loader-text');
      if(loaderText) loaderText.textContent = 'جاري رفع البيانات والصورة...';

      const requestId = await createUniqueRequestId();
      const filePath = `screenshots/${requestId}/screenshot.jpg`;
      const fileRef = ref(storage, filePath);
      await uploadBytes(fileRef, compressed, { contentType: 'image/jpeg' });
      // ملحوظة أمان: لا نخزّن رابط التحميل (screenshotUrl) هنا، لأن مستند الطلب
      // ده قابل للقراءة بمعرفة رقم الطلب فقط. رابط Firebase Storage المباشر
      // بيحمل Token بيتخطى قواعد الأمان لمن يحصل عليه، فبنخزن المسار (path) فقط
      // ونولّد رابط التحميل وقت فتح الأدمن للطلب فقط (getDownloadURL بتتحقق وقتها
      // من صلاحية القراءة في storage.rules).

      await setDoc(doc(db,'requests',requestId), {
        requestId, name, phone,
        program: PROGRAM_NAME,
        group, feesCode: fees,
        screenshotPath: filePath,
        status: 'pending',
        rejectReason: null,
        groupLink: null,
        reviewedBy: null,
        reviewedAt: null,
        createdAt: serverTimestamp()
      });

      renderSuccess(requestId);
    }catch(err){
      console.error(err);
      app.innerHTML = `<main><div class="wrap"><div class="card center">
        <p style="font-weight:700;color:var(--bad)">حدث خطأ أثناء إرسال الطلب</p>
        <p class="muted" style="margin-top:8px">${escapeHtml(err.message || '')}</p>
        <button class="btn btn-secondary" style="margin-top:16px" onclick="location.hash='#/apply'">إعادة المحاولة</button>
      </div></div></main>`;
    }
  };
}

function renderSuccess(requestId){
  app.innerHTML = `
  <main style="padding-top:60px"><div class="wrap">
    <div class="card center">
      <div style="font-size:44px;margin-bottom:6px">✅</div>
      <h2 style="font-size:20px;margin-bottom:4px">تم إرسال طلبك بنجاح</h2>
      <p class="muted" style="margin-top:8px">احتفظ برقم الطلب لمتابعة حالة طلبك لاحقًا</p>
      <div class="req-id-box">
        <div class="muted">رقم الطلب</div>
        <div class="num">${requestId}</div>
      </div>
      <div class="stack">
        <button class="btn btn-teal" id="go-status">متابعة حالة الطلب</button>
        <button class="btn btn-ghost" id="go-home2">العودة للرئيسية</button>
      </div>
    </div>
  </div></main>`;
  document.getElementById('go-status').onclick = () => go(`/track/${requestId}`);
  document.getElementById('go-home2').onclick = () => go('/');
}

/* ---------------- Track ---------------- */
function renderTrackLookup(){
  app.innerHTML = `
  <header class="hero" style="padding:22px 0">
    <div class="wrap topbar">
      <button class="link-btn" id="back-home">→ رجوع</button>
      <span style="font-weight:700;font-size:14px">متابعة طلب سابق</span>
    </div>
  </header>
  <main><div class="wrap">
    <div class="card">
      <div class="field">
        <label>رقم الطلب</label>
        <input type="text" id="track-id" placeholder="مثال: GEOM-2026-1025">
        <div class="err" id="track-err">لم يتم العثور على طلب بهذا الرقم</div>
      </div>
      <button class="btn btn-primary" id="track-btn">متابعة</button>
    </div>
  </div></main>`;
  document.getElementById('back-home').onclick = () => go('/');
  document.getElementById('track-btn').onclick = () => {
    const id = document.getElementById('track-id').value.trim().toUpperCase();
    if(!id) return;
    go(`/track/${id}`);
  };
}

async function renderTrackStatus(requestId){
  app.innerHTML = `<main><div class="wrap"><div class="loader"><div class="spinner"></div></div></div></main>`;
  let snap;
  try{ snap = await getDoc(doc(db,'requests',requestId)); }
  catch(e){ snap = null; }

  if(!snap || !snap.exists()){
    app.innerHTML = `
    <header class="hero" style="padding:22px 0">
      <div class="wrap topbar">
        <button class="link-btn" id="back-track">→ رجوع</button>
        <span style="font-weight:700;font-size:14px">متابعة الطلب</span>
      </div>
    </header>
    <main><div class="wrap"><div class="card center">
      <p style="font-weight:700;color:var(--bad)">لم يتم العثور على طلب بهذا الرقم</p>
      <p class="muted" style="margin-top:8px">تأكد من رقم الطلب وحاول مرة أخرى</p>
      <button class="btn btn-secondary" style="margin-top:16px" onclick="location.hash='#/track'">حاول مرة أخرى</button>
    </div></div></main>`;
    document.getElementById('back-track').onclick = () => go('/track');
    return;
  }

  const d = snap.data();
  let body = '';
  if(d.status === 'approved'){
    body = `
      <p class="muted" style="margin-top:14px">المجموعة</p>
      <p style="font-weight:800;font-size:18px;margin-bottom:16px">مجموعة ${escapeHtml(d.group)}</p>
      ${d.groupLink ? `<a href="${escapeHtml(d.groupLink)}" target="_blank" class="btn btn-good" style="text-decoration:none;display:flex">دخول جروب المجموعة</a>` : `<p class="muted">سيتم توفير رابط الجروب قريبًا</p>`}
    `;
  } else if(d.status === 'rejected'){
    body = `
      <p class="muted" style="margin-top:14px">سبب الرفض</p>
      <p style="font-weight:700;margin-bottom:16px">${escapeHtml(d.rejectReason || 'غير محدد')}</p>
      <button class="btn btn-primary" id="reapply-btn">تعديل الطلب وإعادة الإرسال</button>
    `;
  } else {
    body = `<p class="muted" style="margin-top:14px">تم استلام طلبك، وجاري مراجعته من فريق الإرشاد.</p>`;
  }

  app.innerHTML = `
  <header class="hero" style="padding:22px 0">
    <div class="wrap topbar">
      <button class="link-btn" id="back-home">→ الرئيسية</button>
      <span style="font-weight:700;font-size:14px">متابعة الطلب</span>
    </div>
  </header>
  <main><div class="wrap">
    <div class="card">
      <p class="muted">رقم الطلب</p>
      <p style="font-weight:800;font-size:17px;margin-bottom:12px">${escapeHtml(requestId)}</p>
      ${statusBadge(d.status)}
      ${body}
    </div>
  </div></main>`;
  document.getElementById('back-home').onclick = () => go('/');
  const reapply = document.getElementById('reapply-btn');
  if(reapply) reapply.onclick = () => go('/apply');
}

/* ---------------- Admin: login gate ---------------- */
function renderAdminGate(){
  app.innerHTML = `<main><div class="wrap"><div class="loader"><div class="spinner"></div></div></div></main>`;
  onAuthStateChanged(auth, (user) => {
    if(user) renderAdminDashboard(user);
    else renderAdminLogin();
  }, { onlyOnce: true });
}

function renderAdminLogin(){
  app.innerHTML = `
  <header class="hero">
    ${topoSvg(true)}
    <div class="wrap">
      <span class="eyebrow-badge">🔒 لوحة فريق الإرشاد</span>
      <h1 style="font-size:21px">تسجيل دخول فريق الإرشاد</h1>
    </div>
  </header>
  <main><div class="wrap">
    <form class="card" id="login-form">
      <div class="field">
        <label>Username (البريد الإلكتروني)</label>
        <input type="text" id="l-email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="text" id="l-pass" style="font-family:monospace" required>
      </div>
      <div class="err show" id="login-err" style="display:none"></div>
      <button type="submit" class="btn btn-primary" id="login-btn">تسجيل الدخول</button>
    </form>
  </div></main>`;

  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('l-email').value.trim();
    const pass = document.getElementById('l-pass').value;
    const errBox = document.getElementById('login-err');
    document.getElementById('login-btn').disabled = true;
    try{
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      renderAdminDashboard(cred.user);
    }catch(err){
      errBox.style.display = 'block';
      errBox.textContent = 'بيانات الدخول غير صحيحة';
      document.getElementById('login-btn').disabled = false;
    }
  };
}

/* ---------------- Admin: dashboard ---------------- */
let allRequests = [];
let unsubRequests = null;

function renderAdminDashboard(user){
  app.innerHTML = `
  <div class="admin-header">
    <div class="admin-wrap row">
      <div>
        <h1>لوحة تحكم فريق الإرشاد</h1>
        <div class="who">${escapeHtml(user.email)}</div>
      </div>
      <button class="btn btn-ghost" id="logout-btn" style="width:auto;padding:9px 16px;color:#fff;border-color:rgba(255,255,255,.4)">خروج</button>
    </div>
  </div>
  <main><div class="admin-wrap">
    <div class="stats-grid" id="stats-grid"></div>

    <div class="card">
      <h3 style="margin-bottom:14px;font-size:16px">إدارة روابط الجروبات</h3>
      <div class="groups-grid" id="groups-grid"></div>
      <button class="btn btn-teal" id="save-groups" style="margin-top:14px;width:auto;padding:10px 20px">حفظ الروابط</button>
      <span class="muted" id="groups-saved" style="margin-right:10px;display:none">✓ تم الحفظ</span>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="search-box" placeholder="بحث بالاسم / الهاتف / رقم الطلب">
        <select id="filter-status">
          <option value="">كل الحالات</option>
          <option value="pending">قيد المراجعة</option>
          <option value="approved">مقبول</option>
          <option value="rejected">مرفوض</option>
        </select>
        <select id="filter-group">
          <option value="">كل المجموعات</option>
          ${GROUPS.map(g=>`<option value="${g}">مجموعة ${g}</option>`).join('')}
        </select>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>رقم الطلب</th><th>اسم الطالب</th><th>المجموعة</th><th>الهاتف</th><th>الحالة</th><th>التاريخ</th><th>الإجراء</th>
          </tr></thead>
          <tbody id="req-tbody"></tbody>
        </table>
      </div>
    </div>
  </div></main>
  <div id="modal-root"></div>`;

  document.getElementById('logout-btn').onclick = async () => {
    if(unsubRequests) unsubRequests();
    await signOut(auth);
    go('/admin');
    renderAdminGate();
  };

  loadGroupsPanel();

  const q = query(collection(db,'requests'), orderBy('createdAt','desc'));
  unsubRequests = onSnapshot(q, (snap) => {
    allRequests = snap.docs.map(d => d.data());
    renderStats();
    renderTable();
  }, (err) => {
    console.error(err);
    document.getElementById('req-tbody').innerHTML =
      `<tr><td colspan="7" class="center muted">تعذر تحميل الطلبات (${escapeHtml(err.message||'')})</td></tr>`;
  });

  document.getElementById('search-box').oninput = renderTable;
  document.getElementById('filter-status').onchange = renderTable;
  document.getElementById('filter-group').onchange = renderTable;
}

function renderStats(){
  const total = allRequests.length;
  const pending = allRequests.filter(r=>r.status==='pending').length;
  const approved = allRequests.filter(r=>r.status==='approved').length;
  const rejected = allRequests.filter(r=>r.status==='rejected').length;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="n">${total}</div><div class="l">إجمالي الطلبات</div></div>
    <div class="stat-card"><div class="n">${pending}</div><div class="l">🟡 قيد المراجعة</div></div>
    <div class="stat-card"><div class="n">${approved}</div><div class="l">🟢 مقبولة</div></div>
    <div class="stat-card"><div class="n">${rejected}</div><div class="l">🔴 مرفوضة</div></div>
    <div class="stat-card"><div class="n">${pending}</div><div class="l">طلبات جديدة</div></div>
  `;
}

function renderTable(){
  const term = document.getElementById('search-box').value.trim().toLowerCase();
  const st = document.getElementById('filter-status').value;
  const grp = document.getElementById('filter-group').value;

  const rows = allRequests.filter(r => {
    if(st && r.status !== st) return false;
    if(grp && r.group !== grp) return false;
    if(term){
      const hay = `${r.name} ${r.phone} ${r.requestId}`.toLowerCase();
      if(!hay.includes(term)) return false;
    }
    return true;
  });

  document.getElementById('req-tbody').innerHTML = rows.length ? rows.map(r => `
    <tr>
      <td>${escapeHtml(r.requestId)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>مجموعة ${escapeHtml(r.group)}</td>
      <td>${escapeHtml(r.phone)}</td>
      <td>${statusBadge(r.status)}</td>
      <td>${fmtDate(r.createdAt)}</td>
      <td><button class="row-btn btn-teal" data-id="${escapeHtml(r.requestId)}">فتح</button></td>
    </tr>
  `).join('') : `<tr><td colspan="7" class="center muted" style="padding:24px">لا توجد طلبات مطابقة</td></tr>`;

  document.querySelectorAll('#req-tbody button[data-id]').forEach(btn => {
    btn.onclick = () => openRequestModal(btn.dataset.id);
  });
}

function openRequestModal(requestId){
  const r = allRequests.find(x => x.requestId === requestId);
  if(!r) return;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-head">
        <h3 style="font-size:17px">تفاصيل الطلب</h3>
        <button class="close-x" id="modal-close">✕</button>
      </div>
      <div class="kv">
        <b>الاسم</b><span>${escapeHtml(r.name)}</span>
        <b>الهاتف</b><span>${escapeHtml(r.phone)}</span>
        <b>البرنامج</b><span>${escapeHtml(r.program)}</span>
        <b>المجموعة</b><span>مجموعة ${escapeHtml(r.group)}</span>
        <b>كود المصاريف</b><span>${escapeHtml(r.feesCode)}</span>
        <b>رقم الطلب</b><span>${escapeHtml(r.requestId)}</span>
        <b>تاريخ التقديم</b><span>${fmtDate(r.createdAt)}</span>
        <b>الحالة</b><span>${statusBadge(r.status)}</span>
        ${r.reviewedBy ? `<b>راجعها</b><span>${escapeHtml(r.reviewedBy)}</span>` : ''}
        ${r.status==='rejected' ? `<b>سبب الرفض</b><span>${escapeHtml(r.rejectReason||'')}</span>` : ''}
      </div>
      <div id="ss-holder" class="muted center" style="margin-bottom:16px">جاري تحميل الصورة...</div>
      <div id="modal-actions" class="stack">
        <button class="btn btn-good" id="approve-btn">🟢 قبول الطلب</button>
        <button class="btn btn-bad" id="reject-btn">🔴 رفض الطلب</button>
      </div>
      <div id="reject-panel" class="hidden" style="margin-top:14px">
        <div class="field">
          <label>سبب الرفض</label>
          <select id="reject-reason-select">
            ${REJECT_REASONS.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('')}
          </select>
        </div>
        <div class="field" id="custom-reason-field" style="display:none">
          <label>اكتب السبب</label>
          <input type="text" id="custom-reason">
        </div>
        <button class="btn btn-bad" id="confirm-reject-btn">تأكيد الرفض</button>
      </div>
    </div>
  </div>`;

  document.getElementById('modal-close').onclick = () => root.innerHTML = '';
  document.getElementById('modal-bg').onclick = (e) => { if(e.target.id === 'modal-bg') root.innerHTML=''; };

  if(r.screenshotPath){
    getDownloadURL(ref(storage, r.screenshotPath)).then(url => {
      const holder = document.getElementById('ss-holder');
      if(holder) holder.outerHTML = `<img class="ss-img" src="${escapeHtml(url)}" alt="Screenshot">`;
    }).catch(() => {
      const holder = document.getElementById('ss-holder');
      if(holder) holder.textContent = 'تعذر تحميل الصورة';
    });
  } else {
    const holder = document.getElementById('ss-holder');
    if(holder) holder.textContent = 'لا توجد صورة مرفوعة';
  }

  const approveBtn = document.getElementById('approve-btn');
  const rejectBtn = document.getElementById('reject-btn');
  const rejectPanel = document.getElementById('reject-panel');

  if(r.status !== 'pending'){
    document.getElementById('modal-actions').innerHTML =
      `<p class="muted center">تم اتخاذ إجراء على هذا الطلب بالفعل</p>`;
  } else {
    approveBtn.onclick = async () => {
      approveBtn.disabled = true;
      try{
        const groupsDoc = await getDoc(doc(db,'meta','groupLinks'));
        const links = groupsDoc.exists() ? groupsDoc.data() : {};
        await updateDoc(doc(db,'requests',requestId), {
          status: 'approved',
          groupLink: links[`group${r.group}`] || null,
          reviewedBy: auth.currentUser.email,
          reviewedAt: serverTimestamp()
        });
        root.innerHTML = '';
      }catch(e){ alert('حدث خطأ: ' + e.message); approveBtn.disabled=false; }
    };
    rejectBtn.onclick = () => rejectPanel.classList.remove('hidden');
    document.getElementById('reject-reason-select').onchange = (e) => {
      document.getElementById('custom-reason-field').style.display =
        e.target.value === 'سبب آخر' ? 'block' : 'none';
    };
    document.getElementById('confirm-reject-btn').onclick = async () => {
      const sel = document.getElementById('reject-reason-select').value;
      const custom = document.getElementById('custom-reason').value.trim();
      const reason = sel === 'سبب آخر' ? (custom || 'سبب آخر') : sel;
      try{
        await updateDoc(doc(db,'requests',requestId), {
          status: 'rejected',
          rejectReason: reason,
          reviewedBy: auth.currentUser.email,
          reviewedAt: serverTimestamp()
        });
        root.innerHTML = '';
      }catch(e){ alert('حدث خطأ: ' + e.message); }
    };
  }
}

async function loadGroupsPanel(){
  const grid = document.getElementById('groups-grid');
  grid.innerHTML = GROUPS.map(g => `
    <div class="group-row">
      <label>مجموعة ${g}</label>
      <input type="text" id="group-link-${g}" placeholder="رابط جروب مجموعة ${g}">
    </div>
  `).join('');

  try{
    const snap = await getDoc(doc(db,'meta','groupLinks'));
    if(snap.exists()){
      const data = snap.data();
      GROUPS.forEach(g => {
        const el = document.getElementById(`group-link-${g}`);
        if(el && data[`group${g}`]) el.value = data[`group${g}`];
      });
    }
  }catch(e){ console.error(e); }

  document.getElementById('save-groups').onclick = async () => {
    const payload = {};
    GROUPS.forEach(g => { payload[`group${g}`] = document.getElementById(`group-link-${g}`).value.trim(); });
    try{
      await setDoc(doc(db,'meta','groupLinks'), payload, { merge:true });
      const saved = document.getElementById('groups-saved');
      saved.style.display = 'inline';
      setTimeout(()=>saved.style.display='none', 2000);
    }catch(e){ alert('حدث خطأ أثناء الحفظ: ' + e.message); }
  };
}

route();
</script>
</body>
</html>
