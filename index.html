function withTimeout(p, ms = 25000){
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(

/**
 * ضغط الصورة لحد ~35KB بسرعة: بيصغّر الصورة مرة واحدة بس لأبعاد صغيرة،
 * وبعدها يجرّب درجات جودة من نفس الـ canvas (من غير إعادة رسم كل مرة).
 * بترجع Data URL (نص) بيتخزن في Firestore.
 */
async function compressToDataUrl(file, targetBytes = 35 * 1024){
  const img = await new Promise((res, rej) => {
    const im = new Image();
    const url = URL.createObjectURL(file);
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('تعذر قراءة الصورة')); };
    im.src = url;
  });
  const draw = (maxDim) => {
    const s = Math.min(1, maxDim / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * s));
    c.height = Math.max(1, Math.round(img.height * s));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c;
  };
  const size = (u) => u.length * 0.75;
  let out = '';
  // محاولة 1: 800px بجودات مختلفة، محاولة 2: 640px، محاولة 3: 520px
  for(const maxDim of [800, 640, 520]){
    const c = draw(maxDim);
    for(const q of [0.5, 0.4, 0.3, 0.22]){
      out = c.toDataURL('image/jpeg', q);
      if(size(out) <= targetBytes) return out;
    }
  }
  return out; // أصغر نسخة (حتى لو زادت شوية عن الهدف، لسه صغيرة جدًا)
}

        <label class="checkline">
          <input type="checkbox" id="f-confirm">
          <span>أقر بأن البيانات التي أدخلتها صحيحة وأن Screenshot المرفوع يخصني.</span>
        </label>
        <div class="err" id="err-confirm">من فضلك أكّد إقرارك قبل الإرسال</div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">إرسال الطلب</button>
    </form>
  </div></main>`;

  document.getElementById('back-home').onclick = () => go('/');

  const fileInput = document.getElementById('f-file');
  const uploadBox = document.getElementById('upload-box');
  const preview = document.getElementById('upload-preview');
  const placeholder = document.getElementById('upload-placeholder');
  let selectedFile = null;

  fileInput.onchange = () => {
    const file = fileInput.files[0];
    if(!file) return;
    const okType = ['image/jpeg','image/png','image/webp'].includes(file.type);
    const okSize = file.size <= 10*1024*1024;
    if(!okType || !okSize){
      document.getElementById('err-file').classList.add('show');
      selectedFile = null;
      return;
    }
    document.getElementById('err-file').classList.remove('show');
    selectedFile = file;
    uploadBox.classList.add('has-file');
    placeholder.classList.add('hidden');
    preview.classList.remove('hidden');
    preview.src = URL.createObjectURL(file);
  };

  document.getElementById('apply-form').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const group = document.getElementById('f-group').value;
    const confirmed = document.getElementById('f-confirm').checked;

    let valid = true;
    const setErr = (id, cond) => { document.getElementById(id).classList.toggle('show', cond); if(cond) valid=false; };
    setErr('err-name', name.split(/\s+/).filter(Boolean).length < 3);
    setErr('err-phone', !/^01[0-9]{9}$/.test(phone));
    setErr('err-group', !group);
    setErr('err-file', !selectedFile);
    setErr('err-confirm', !confirmed);
    if(!valid) return;

    document.getElementById('submit-btn').disabled = true;
    app.innerHTML = `<main><div class="wrap"><div class="loader">
      <div class="spinner"></div>
      <p style="font-weight:700" id="loader-text">جاري تجهيز الصورة...</p>
    </div></div></main>`;

    try{
      const imageData = await compressToDataUrl(selectedFile);
      const loaderText = document.getElementById('loader-text');
      if(loaderText) loaderText.textContent = 'جاري رفع البيانات...';

      // من غير قراءة مسبقة (أسرع): لو الرقم اتكرر الـ Rules بترفض الإنشاء
      // فبنجرّب رقم تاني تلقائيًا (لحد 4 محاولات)
      let requestId = null, lastErr = null;
      for(let attempt = 0; attempt < 4; attempt++){
        const id = genRequestId();
        const batch = writeBatch(db);
        batch.set(doc(db,'requestImages',id), {
          requestId: id, data: imageData, createdAt: serverTimestamp()
        });
        batch.set(doc(db,'requests',id), {
          requestId: id, name, phone,
          program: PROGRAM_NAME,
          group,
          hasImage: true,
          status: 'pending',
          rejectReason: null,
          groupLink: null,
          reviewedBy: null,
          reviewedAt: null,
          createdAt: serverTimestamp()
        });
        try{
          await withTimeout(batch.commit(), 20000);
          requestId = id; break;
        }catch(e){
          lastErr = e;
          if(e.code !== 'permission-denied') throw e; // مش تكرار رقم → اعرض الخطأ
        }
      }
      if(!requestId) throw lastErr || new Error('تعذر إنشاء الطلب');

      renderSuccess(requestId);
    }catch(err){
      console.error(err);
      app.innerHTML = `<main><div class="wrap"><div class="card center">
        <p style="font-weight:700;color:var(--bad)">حدث خطأ أثناء إرسال الطلب</p>
        <p class="muted" style="margin-top:8px">${escapeHtml(err.message || '')}</p>
        <button class="btn btn-secondary" style="margin-top:16px" onclick="location.hash='#/apply'">إعادة المحاولة</button>
      </div></div></main>`;
    }
  };
}

    <div class="stat-card"><div class="n">${pending}</div><div class="l">طلبات جديدة</div></div>
  `;

function renderTable(){
  const term = document.getElementById('search-box').value.trim().toLowerCase();
  const st = document.getElementById('filter-status').value;
  const grp = document.getElementById('filter-group').value;

  const rows = allRequests.filter(r => {
    if(st && r.status !== st) return false;
    if(grp && r.group !== grp) return false;
    if(term){
      const hay = `${r.name} ${r.phone} ${r.requestId}`.toLowerCase();
      if(!hay.includes(term)) return false;
    }
    return true;
  });

  document.getElementById('req-tbody').innerHTML = rows.length ? rows.map(r => `

/* الصور بتتقرا من Firestore (requestImages) وبتتخزن مؤقتًا في الذاكرة */
const thumbCache = {};
async function getImageSrc(r){
  if(thumbCache[r.requestId]) return thumbCache[r.requestId];
  const s = await getDoc(doc(db,'requestImages',r.requestId));
  const src = s.exists() ? s.data().data : null;
  if(src) thumbCache[r.requestId] = src;
  return src;
}
function loadThumb(requestId){
  const r = allRequests.find(x => x.requestId === requestId);
  if(!r) return;
  getImageSrc(r).then(src => {
    const el = document.getElementById(`thumb-${requestId}`);
    if(el && src) el.src = src;
  }).catch(() => {});
}

          reviewedAt: serverTimestamp()
        });
        root.innerHTML = '';
      }catch(e){ alert('حدث خطأ: ' + e.message); approveBtn.disabled=false; }
    };
    rejectBtn.onclick = () => rejectPanel.classList.remove('hidden');
    document.getElementById('reject-reason-select').onchange = (e) => {
      document.getElementById('custom-reason-field').style.display =
        e.target.value === 'سبب آخر' ? 'block' : 'none';
    };
    document.getElementById('confirm-reject-btn').onclick = async () => {
      const reviewer = getReviewer();
      if(!reviewer) return;
      const sel = document.getElementById('reject-reason-select').value;
      const custom = document.getElementById('custom-reason').value.trim();
      const reason = sel === 'سبب آخر' ? (custom || 'سبب آخر') : sel;
      try{
        await updateDoc(doc(db,'requests',requestId), {
          status: 'rejected',
          rejectReason: reason,
          reviewedBy: reviewer,
          reviewedAt: serverTimestamp()
        });
        root.innerHTML = '';
      }catch(e){ alert('حدث خطأ: ' + e.message); }
    };
  }
}

async function openGroupsModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-bg" id="groups-modal-bg">
    <div class="modal">
      <div class="modal-head">
        <h3 style="font-size:17px">روابط الجروبات</h3>
        <button class="close-x" id="groups-modal-close">✕</button>
      </div>
      <div class="field">
        <label>رابط جروب الدفعة الأساسي (للكل)</label>
        <input type="text" id="group-link-main">
      </div>
      <div class="groups-grid" id="groups-grid"></div>
      <button class="btn btn-teal" id="save-groups" style="margin-top:16px">حفظ الروابط</button>
      <p class="muted center" id="groups-saved" style="display:none;margin-top:8px">✓ تم الحفظ</p>
    </div>
  </div>`;

  document.getElementById('groups-modal-close').onclick = () => root.innerHTML = '';
  document.getElementById('groups-modal-bg').onclick = (e) => { if(e.target.id === 'groups-modal-bg') root.innerHTML=''; };

  const grid = document.getElementById('groups-grid');
  grid.innerHTML = GROUPS.map(g => `
    <div class="group-row">
      <label>مجموعة ${g}</label>
      <input type="text" id="group-link-${g}" style="direction:ltr;text-align:left">
    </div>
  `).join('');

  try{
    const snap = await getDoc(doc(db,'meta','groupLinks'));
    if(snap.exists()){
      const data = snap.data();
      const mainEl = document.getElementById('group-link-main');
      if(mainEl && data.main) mainEl.value = data.main;
      GROUPS.forEach(g => {
        const el = document.getElementById(`group-link-${g}`);
        if(el && data[`group${g}`]) el.value = data[`group${g}`];
      });
    }
  }catch(e){ console.error(e); }

  document.getElementById('save-groups').onclick = async () => {
    const payload = { main: document.getElementById('group-link-main').value.trim() };
    GROUPS.forEach(g => { payload[`group${g}`] = document.getElementById(`group-link-${g}`).value.trim(); });
    try{
      await withTimeout(setDoc(doc(db,'meta','groupLinks'), payload, { merge:true }), 15000);

      // مزامنة الطلبات المقبولة بالفعل: الرابط بيتنسخ داخل الطلب وقت القبول،
      // فلو الطلب اتقبل قبل حفظ الروابط (أو الرابط اتغير) لازم نحدّثه هنا
      const toSync = allRequests.filter(r => r.status === 'approved' && (
        (r.groupLink || null) !== (payload[`group${r.group}`] || null) ||
        (r.mainGroupLink || null) !== (payload.main || null)
      ));
      for(let i = 0; i < toSync.length; i += 400){
        const batch = writeBatch(db);
        toSync.slice(i, i + 400).forEach(r => {
          batch.update(doc(db,'requests',r.requestId), {
            groupLink: payload[`group${r.group}`] || null,
            mainGroupLink: payload.main || null
          });
        });
        await withTimeout(batch.commit(), 20000);
      }

      const saved = document.getElementById('groups-saved');
      saved.textContent = toSync.length ? `✓ تم الحفظ وتحديث ${toSync.length} طلب مقبول` : '✓ تم الحفظ';
      saved.style.display = 'block';
      setTimeout(()=>saved.style.display='none', 3000);
    }catch(e){ alert('حدث خطأ أثناء الحفظ: ' + (e.code || '') + ' ' + e.message); }
  };
}

route();
</script>
